# charts/customer-care/values.yaml
# ====================================



replicaCount: 2

image:
  repository: myrepo/customer-care-service
  tag: "1.0"
  pullPolicy: IfNotPresent

service:
  port: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

persistence:
  enabled: true
  size: 5Gi
  