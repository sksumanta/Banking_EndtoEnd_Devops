# templates/deployment.yaml
# ===================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "banking.fullname" . }}
  labels:
    {{- include "banking.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      {{- include "banking.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "banking.selectorLabels" . | nindent 8 }}

    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: {{ .Values.service.port }}

          envFrom:
            - configMapRef:
                name: {{ include "banking.fullname" . }}-config
            - secretRef:
                name: {{ include "banking.fullname" . }}-secret

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 10