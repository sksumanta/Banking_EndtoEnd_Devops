# templates/service.yaml
#===================================

apiVersion: v1
kind: Service
metadata:
  name: {{ include "banking.fullname" . }}
  labels:
    {{- include "banking.labels" . | nindent 4 }}

spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}

  selector:
    {{- include "banking.selectorLabels" . | nindent 4 }}