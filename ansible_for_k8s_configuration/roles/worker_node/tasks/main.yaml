---
- name: Gather Kubernetes join command on master
  hosts: k8s-master
  become: yes
  tasks:
    - name: Get kubeadm join command
      command: kubeadm token create --print-join-command
      register: join_cmd
      changed_when: false  # ensures idempotency

    - name: Save join command in host var
      set_fact:
        join_command: "{{ join_cmd.stdout }}"

- name: Join worker nodes to the cluster
  hosts: k8s-workers
  become: yes
  tasks:
    - name: Join cluster dynamically
      command: "{{ hostvars['k8s-master']['join_command'] }}"
      when: hostvars['k8s-master']['join_command'] is defined