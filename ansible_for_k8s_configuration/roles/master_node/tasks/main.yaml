
# Master Node Setup

---
- name: Initialize Kubernetes Master
  hosts: k8s-master
  become: yes
  tasks:

    - name: Check if Kubernetes is already initialized
      stat:
        path: /etc/kubernetes/admin.conf
      register: kube_admin_conf

    - name: Initialize Kubernetes Master
      command: kubeadm init --pod-network-cidr={{ pod_network_cidr }}
      register: kubeadm_output
      when: not kube_admin_conf.stat.exists

    - name: Save kubeadm join command for workers
      command: kubeadm token create --print-join-command
      register: join_cmd
      changed_when: false
      when: not kube_admin_conf.stat.exists

    - name: Set join command fact for workers
      set_fact:
        join_command: "{{ join_cmd.stdout }}"
      when: join_cmd is defined

    - name: Create kube directory
      file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy admin.conf
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ubuntu/.kube/config
        owner: ubuntu
        group: ubuntu
        mode: '0644'
        remote_src: yes

    - name: Install Calico network
      command: kubectl apply -f https://docs.projectcalico.org/manifests/calico.yaml
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      args:
        warn: false
      register: calico_result
      changed_when: "'created' in calico_result.stdout or 'configured' in calico_result.stdout"
      when: not kube_admin_conf.stat.exists